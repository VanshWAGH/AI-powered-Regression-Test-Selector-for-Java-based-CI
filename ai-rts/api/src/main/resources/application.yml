spring:
  datasource:
    url: jdbc:h2:mem:airts;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
logging:
  level:
    com.ai.rts: INFO

github:
  token: ${GITHUB_TOKEN:}

# When set, all /api/v1/** requests must send Authorization: Bearer <token>
ai:
  rts:
    api-token: ${AI_RTS_API_TOKEN:}
    model:
      path: ${AI_RTS_MODEL_PATH:classpath:models/rts-v1.onnx}
      enabled: ${AI_RTS_MODEL_ENABLED:true}
