spring:
  datasource:
    url: jdbc:h2:mem:airts;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
logging:
  level:
    com.ai.rts: INFO

github:
  token: ${GITHUB_TOKEN:}
