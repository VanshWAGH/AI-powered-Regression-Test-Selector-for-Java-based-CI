# After a successful default-branch push build, downloads Surefire XML from that CI run and
# POSTs them to your deployed selector API (/history/ingest). No seed data — uses real reports.
#
# Required repository secret: AI_RTS_API_BASE_URL (e.g. https://selector.example.com)
# Optional: AI_RTS_API_TOKEN — must match server env AI_RTS_API_TOKEN (Bearer auth)
# Optional: AI_RTS_REPO_ID — defaults to github.event.repository.name
name: AI-RTS History Ingest

on:
  workflow_run:
    workflows: ["AI-RTS CI"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  ingest-surefire:
    name: Ingest Surefire reports
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      secrets.AI_RTS_API_BASE_URL != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download Surefire artifact from triggering workflow
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: surefire-reports-${{ github.event.workflow_run.id }}
          path: surefire-download
          if_no_artifact_found: warn

      - name: Build CLI
        run: mvn -f ai-rts/pom.xml -pl cli -am -DskipTests package

      - name: Count Surefire XML files
        id: count
        run: |
          set -euo pipefail
          if [ ! -d surefire-download ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(find surefire-download -type f -name 'TEST-*.xml' | wc -l | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Push history to selector API
        if: steps.count.outputs.count != '0'
        env:
          AI_RTS_API_BASE_URL: ${{ secrets.AI_RTS_API_BASE_URL }}
          AI_RTS_API_TOKEN: ${{ secrets.AI_RTS_API_TOKEN }}
          REPO_ID_SECRET: ${{ secrets.AI_RTS_REPO_ID }}
          FALLBACK_REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          REPO_SLUG="${REPO_ID_SECRET:-$FALLBACK_REPO}"
          CORRELATION="ci-${{ github.event.workflow_run.head_sha }}"
          TOKEN_ARGS=
          if [ -n "${AI_RTS_API_TOKEN:-}" ]; then
            TOKEN_ARGS="--api-token=${AI_RTS_API_TOKEN}"
          fi
          java -jar ai-rts/cli/target/cli-0.1.0-SNAPSHOT.jar \
            --ingest \
            --api-url="${AI_RTS_API_BASE_URL}" \
            ${TOKEN_ARGS} \
            --repo-id="${REPO_SLUG}" \
            --correlation-id="${CORRELATION}" \
            --surefire-dir=surefire-download
