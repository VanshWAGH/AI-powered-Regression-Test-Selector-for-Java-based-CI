# On pull requests, call the deployed selector API and run the recommended Maven test subset.
# Falls back to full `mvn test` when the API is unreachable or returns an empty subset.
#
# Required secret to enable: AI_RTS_API_BASE_URL
# Optional: AI_RTS_API_TOKEN, AI_RTS_REPO_ID (defaults to repository name)
name: AI-RTS PR Select

on:
  pull_request:
    branches: [main, master]

jobs:
  select-and-test:
    runs-on: ubuntu-latest
    if: ${{ secrets.AI_RTS_API_BASE_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build CLI
        run: mvn -f ai-rts/pom.xml -pl cli -am -DskipTests package

      - name: Resolve test command from selector API
        id: select
        env:
          AI_RTS_API_BASE_URL: ${{ secrets.AI_RTS_API_BASE_URL }}
          AI_RTS_API_TOKEN: ${{ secrets.AI_RTS_API_TOKEN }}
          REPO_ID_SECRET: ${{ secrets.AI_RTS_REPO_ID }}
        run: |
          set -euo pipefail
          REPO_SLUG="${REPO_ID_SECRET:-${{ github.event.repository.name }}}"
          REPO_URL="https://github.com/${{ github.repository }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          TOKEN_ARGS=
          if [ -n "${AI_RTS_API_TOKEN:-}" ]; then
            TOKEN_ARGS="--api-token=${AI_RTS_API_TOKEN}"
          fi
          CMD=$(java -jar ai-rts/cli/target/cli-0.1.0-SNAPSHOT.jar \
            --api-url="${AI_RTS_API_BASE_URL}" \
            ${TOKEN_ARGS} \
            --repo-id="${REPO_SLUG}" \
            --repo-url="${REPO_URL}" \
            --pr-id="${PR_NUM}" \
            --test-history-days=30 \
            --output-format=surefire)
          echo "cmd=${CMD}" >> "$GITHUB_OUTPUT"
          echo "Selected command: ${CMD}"

      - name: Run selected tests
        run: ${{ steps.select.outputs.cmd }}
